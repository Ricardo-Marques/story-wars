<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80">
  <defs>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="80" rx="16" fill="#0F1221"/>
  <text x="240" y="50" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-weight="800" font-size="48" letter-spacing="1" fill="#7B2FDB" filter="url(#glow)">Story Wars</text>
  <text x="240" y="72" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-weight="300" font-size="11" letter-spacing="1" fill="#AAB0D6">Write stories. Guess authors. Win glory.</text>
</svg>
